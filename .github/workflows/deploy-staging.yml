name: Déploiement — préproduction

# Every push to the working branch lands on staging, so the Product Owner can
# review the result on his phone. This replaces the per-pull-request preview
# deployments that a managed platform would have provided (architecture §9.1).
on:
  push:
    branches:
      - claude/defi-movember-bmad-init-qa6h3c
  workflow_dispatch:

# A newer push makes an in-flight deployment pointless; cancel it rather than
# let two deployments race for the same container.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  deploy:
    name: Déployer sur la préproduction
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.defi-movember.fr

    steps:
      - name: Préparer la clé SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pins the server's fingerprint for this run. Trust-on-first-use is
          # a known weakness: an attacker able to intercept this very first
          # connection could impersonate the server. Pinning the host key as a
          # secret is a task of the security review (story 11.8).
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Déployer
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "bash /opt/defi-movember/deploy/scripts/deploy.sh '${{ github.sha }}' staging"

      - name: Vérifier que le site répond
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://staging.defi-movember.fr/api/health || echo 000)
          # 401 is the expected answer: staging sits behind basic auth. It
          # proves Traefik routes to the right container and TLS works, which
          # is what this step is checking.
          if [ "$code" = "401" ] || [ "$code" = "200" ]; then
            echo "✓ La préproduction répond (HTTP $code)"
          else
            echo "✗ Réponse inattendue : HTTP $code" >&2
            exit 1
          fi

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key
